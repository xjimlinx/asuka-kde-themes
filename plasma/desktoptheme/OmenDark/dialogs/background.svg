<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="40"
   height="40"
   viewBox="0 0 40 40"
   id="omen-dialog-background">
  <defs
     id="defs">
    <linearGradient
       id="dialog-top"
       gradientUnits="userSpaceOnUse"
       x1="0" y1="0" x2="0" y2="2">
      <stop offset="0" style="stop-color:#E31937;stop-opacity:0.85" />
      <stop offset="1" style="stop-color:#E31937;stop-opacity:0" />
    </linearGradient>
  </defs>

  <rect
     id="top"
     x="10" y="0" width="20" height="2"
     style="fill:url(#dialog-top);fill-opacity:1;stroke:none" />

  <rect
     id="center"
     x="10" y="2" width="20" height="36"
     style="fill:#17171B;fill-opacity:0.98;stroke:none" />

  <rect id="left" x="0" y="10" width="10" height="20" style="fill:#17171B;fill-opacity:0.98" />
  <rect id="right" x="30" y="10" width="10" height="20" style="fill:#17171B;fill-opacity:0.98" />
  <rect id="bottom" x="10" y="38" width="20" height="2" style="fill:#0F0F11" />
  <rect id="topleft" x="0" y="0" width="10" height="10" style="fill:#17171B;fill-opacity:0.98" />
  <rect id="topright" x="30" y="0" width="10" height="10" style="fill:#17171B;fill-opacity:0.98" />
  <rect id="bottomleft" x="0" y="30" width="10" height="10" style="fill:#17171B;fill-opacity:0.98" />
  <rect id="bottomright" x="30" y="30" width="10" height="10" style="fill:#17171B;fill-opacity:0.98" />

  <rect id="hint-top-margin" x="0" y="0" width="40" height="2" style="fill:none" />
  <rect id="hint-bottom-margin" x="0" y="38" width="40" height="2" style="fill:none" />
  <rect id="hint-left-margin" x="0" y="0" width="10" height="40" style="fill:none" />
  <rect id="hint-right-margin" x="30" y="0" width="10" height="40" style="fill:none" />
  <rect id="hint-top-inset" x="0" y="0" width="40" height="0" style="fill:none" />
  <rect id="hint-bottom-inset" x="0" y="40" width="40" height="0" style="fill:none" />
  <rect id="hint-left-inset" x="0" y="0" width="0" height="40" style="fill:none" />
  <rect id="hint-right-inset" x="40" y="0" width="0" height="40" style="fill:none" />
</svg>
