<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="32"
   height="32"
   viewBox="0 0 32 32"
   id="omen-tooltip">
  <defs
     id="defs">
    <linearGradient
       id="tooltip-border"
       gradientUnits="userSpaceOnUse"
       x1="0" y1="0" x2="0" y2="6">
      <stop offset="0" style="stop-color:#E31937;stop-opacity:0.9" />
      <stop offset="1" style="stop-color:#E31937;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <rect
     id="top"
     x="6" y="0" width="20" height="1"
     style="fill:url(#tooltip-border);fill-opacity:1;stroke:none" />

  <!-- Tooltip surface -->
  <rect
     id="center"
     x="6" y="1" width="20" height="30"
     style="fill:#1E1E22;fill-opacity:0.97;stroke:none" />

  <!-- Plain dark sides with a subtle 1px outline -->
  <rect id="left" x="0" y="6" width="6" height="20" style="fill:#1E1E22;fill-opacity:0.97" />
  <rect id="right" x="26" y="6" width="6" height="20" style="fill:#1E1E22;fill-opacity:0.97" />
  <rect id="bottom" x="6" y="31" width="20" height="1" style="fill:#2A2A30" />
  <rect id="topleft" x="0" y="0" width="6" height="6" style="fill:#1E1E22;fill-opacity:0.97" />
  <rect id="topright" x="26" y="0" width="6" height="6" style="fill:#1E1E22;fill-opacity:0.97" />
  <rect id="bottomleft" x="0" y="26" width="6" height="6" style="fill:#1E1E22;fill-opacity:0.97" />
  <rect id="bottomright" x="26" y="26" width="6" height="6" style="fill:#1E1E22;fill-opacity:0.97" />

  <rect id="hint-top-margin" x="0" y="0" width="32" height="1" style="fill:none" />
  <rect id="hint-bottom-margin" x="0" y="31" width="32" height="1" style="fill:none" />
  <rect id="hint-left-margin" x="0" y="0" width="6" height="32" style="fill:none" />
  <rect id="hint-right-margin" x="26" y="0" width="6" height="32" style="fill:none" />
  <rect id="hint-top-inset" x="0" y="0" width="32" height="0" style="fill:none" />
  <rect id="hint-bottom-inset" x="0" y="32" width="32" height="0" style="fill:none" />
  <rect id="hint-left-inset" x="0" y="0" width="0" height="32" style="fill:none" />
  <rect id="hint-right-inset" x="32" y="0" width="0" height="32" style="fill:none" />
</svg>
