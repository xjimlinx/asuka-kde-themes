<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   width="168"
   height="136"
   viewBox="0 0 168 136"
   id="omen-decoration">
  <defs
     id="omen-defs">
    <!-- Soft drop shadows: darkest next to the window, transparent at the outer edge -->
    <linearGradient
       id="shadow-top-grad"
       gradientUnits="userSpaceOnUse"
       x1="0" y1="0" x2="0" y2="24">
      <stop offset="0" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="1" style="stop-color:#000000;stop-opacity:0.26" />
    </linearGradient>
    <linearGradient
       id="shadow-bottom-grad"
       gradientUnits="userSpaceOnUse"
       x1="0" y1="5" x2="0" y2="37">
      <stop offset="0" style="stop-color:#000000;stop-opacity:0.28" />
      <stop offset="1" style="stop-color:#000000;stop-opacity:0" />
    </linearGradient>
    <linearGradient
       id="shadow-left-grad"
       gradientUnits="userSpaceOnUse"
       x1="0" y1="0" x2="24" y2="0">
      <stop offset="0" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="1" style="stop-color:#000000;stop-opacity:0.26" />
    </linearGradient>
    <linearGradient
       id="shadow-right-grad"
       gradientUnits="userSpaceOnUse"
       x1="2" y1="0" x2="26" y2="0">
      <stop offset="0" style="stop-color:#000000;stop-opacity:0.26" />
      <stop offset="1" style="stop-color:#000000;stop-opacity:0" />
    </linearGradient>
    <linearGradient
       id="shadow-topleft-grad"
       gradientUnits="userSpaceOnUse"
       x1="0" y1="0" x2="26" y2="26">
      <stop offset="0" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="1" style="stop-color:#000000;stop-opacity:0.26" />
    </linearGradient>
    <linearGradient
       id="shadow-topright-grad"
       gradientUnits="userSpaceOnUse"
       x1="26" y1="0" x2="0" y2="26">
      <stop offset="0" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="1" style="stop-color:#000000;stop-opacity:0.26" />
    </linearGradient>
    <linearGradient
       id="shadow-bottomleft-grad"
       gradientUnits="userSpaceOnUse"
       x1="0" y1="37" x2="26" y2="0">
      <stop offset="0" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="1" style="stop-color:#000000;stop-opacity:0.28" />
    </linearGradient>
    <linearGradient
       id="shadow-bottomright-grad"
       gradientUnits="userSpaceOnUse"
       x1="26" y1="37" x2="0" y2="0">
      <stop offset="0" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="1" style="stop-color:#000000;stop-opacity:0.28" />
    </linearGradient>
  </defs>

  <!-- Center: titlebar / window surface -->
  <rect
     id="decoration-center"
     x="26" y="26" width="116" height="73"
     style="fill:#17171B;fill-opacity:1;stroke:none" />

  <!-- Top edge: soft shadow + OMEN red accent line on the window's top edge -->
  <g
     id="decoration-top">
    <rect
       x="0" y="0" width="116" height="24"
       style="fill:url(#shadow-top-grad);fill-opacity:1;stroke:none" />
    <rect
       x="0" y="24" width="116" height="2"
       style="fill:#E31937;fill-opacity:1;stroke:none" />
  </g>

  <!-- Top-left corner -->
  <g
     id="decoration-topleft">
    <rect
       x="0" y="0" width="26" height="26"
       style="fill:url(#shadow-topleft-grad);fill-opacity:1;stroke:none" />
    <rect
       x="24" y="24" width="2" height="2"
       style="fill:#E31937;fill-opacity:1;stroke:none" />
  </g>

  <!-- Top-right corner -->
  <g
     id="decoration-topright">
    <rect
       x="0" y="0" width="26" height="26"
       style="fill:url(#shadow-topright-grad);fill-opacity:1;stroke:none" />
    <rect
       x="0" y="24" width="2" height="2"
       style="fill:#E31937;fill-opacity:1;stroke:none" />
  </g>

  <!-- Left edge -->
  <g
     id="decoration-left">
    <rect
       x="0" y="0" width="24" height="73"
       style="fill:url(#shadow-left-grad);fill-opacity:1;stroke:none" />
    <rect
       x="24" y="0" width="2" height="73"
       style="fill:#131318;fill-opacity:1;stroke:none" />
  </g>

  <!-- Right edge -->
  <g
     id="decoration-right">
    <rect
       x="2" y="0" width="24" height="73"
       style="fill:url(#shadow-right-grad);fill-opacity:1;stroke:none" />
    <rect
       x="0" y="0" width="2" height="73"
       style="fill:#131318;fill-opacity:1;stroke:none" />
  </g>

  <!-- Bottom edge -->
  <g
     id="decoration-bottom">
    <rect
       x="0" y="0" width="116" height="5"
       style="fill:#131318;fill-opacity:1;stroke:none" />
    <rect
       x="0" y="5" width="116" height="32"
       style="fill:url(#shadow-bottom-grad);fill-opacity:1;stroke:none" />
  </g>

  <!-- Bottom-left corner -->
  <g
     id="decoration-bottomleft">
    <rect
       x="0" y="0" width="26" height="37"
       style="fill:url(#shadow-bottomleft-grad);fill-opacity:1;stroke:none" />
    <rect
       x="24" y="0" width="2" height="5"
       style="fill:#131318;fill-opacity:1;stroke:none" />
  </g>

  <!-- Bottom-right corner -->
  <g
     id="decoration-bottomright">
    <rect
       x="0" y="0" width="26" height="37"
       style="fill:url(#shadow-bottomright-grad);fill-opacity:1;stroke:none" />
    <rect
       x="0" y="0" width="2" height="5"
       style="fill:#131318;fill-opacity:1;stroke:none" />
  </g>
</svg>
